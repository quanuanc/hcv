spring.application.name=vault_client
# Adopt the existing schema as baseline version 1; future migrations start at V2.
spring.flyway.baseline-on-migrate=true
spring.datasource.url=jdbc:postgresql://localhost:5432/hcv_demo
spring.jpa.open-in-view=true

# Paths are relative to vault_client when running Maven; override for other working directories.
hcv.vault.uri=${VAULT_ADDR:https://127.0.0.1:8200}
hcv.vault.cert-role=spring-boot-demo
hcv.vault.database.path=database/static-creds/hcv-demo
hcv.vault.database.poll-interval=30s
spring.ssl.bundle.pem.vault-login.truststore.certificate=${VAULT_CA:file:../vault_server/.local/server-tls/vault-ca.pem}
spring.ssl.bundle.pem.vault-login.keystore.certificate=${VAULT_CLIENT_CERT:file:../vault_server/.local/client/client.crt}
spring.ssl.bundle.pem.vault-login.keystore.private-key=${VAULT_CLIENT_KEY:file:../vault_server/.local/client/client.key}
spring.ssl.bundle.pem.vault-read.truststore.certificate=${VAULT_CA:file:../vault_server/.local/server-tls/vault-ca.pem}

# Independent KV v2 secret, using the same certificate login and Token as the database.
hcv.vault.kv.demo-service.mount=app-secrets
hcv.vault.kv.demo-service.path=demo-service
hcv.vault.kv.demo-service.poll-interval=5s

hcv.vault.enabled=true
hcv.vault.database.enabled=true
